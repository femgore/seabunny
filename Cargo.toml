[package]
name = "seabunny"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "seabunny"
path = "src/main.rs"

[[bin]]
name = "xdg-desktop-portal-seabunny"
path = "src/portal_main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[build-dependencies]
cxx-qt-build = "0.10.0"
