name: Build release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-packages:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-wayland-dev \
            libkf6windowsystem-dev libglib2.0-dev libarchive-dev python3 ruby ruby-dev rpm
          sudo gem install --no-document fpm
      - name: Build Seabunny
        run: cargo build --release --locked
      - name: Build tarball, deb, and rpm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          test "$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "seabunny"))')" = "$VERSION"
          mkdir -p dist
          PACKAGE_JSON="$(python3 -B packaging/seabunny/package_user.py build --with-portal)"
          PACKAGE_ARCHIVE="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["archive"])' <<< "$PACKAGE_JSON")"
          cp "$PACKAGE_ARCHIVE" "dist/seabunny-${VERSION}-linux-x86_64.tar.gz"
          python3 -B packaging/release/build_packages.py deb --output dist
          python3 -B packaging/release/build_packages.py rpm --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  appimage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-wayland-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-effects \
            qml6-module-qtquick-shapes \
            libkf6windowsystem-dev libglib2.0-dev libarchive-dev python3 patchelf
      - name: Build and bundle AppImage
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          test "$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "seabunny"))')" = "$VERSION"
          cargo build --release --locked
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt
          export PATH="$GITHUB_WORKSPACE:$PATH"
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage --list-plugins
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/seabunny AppDir/usr/bin/
          cp packaging/seabunny/org.femgore.Seabunny.desktop AppDir/usr/share/applications/
          cp packaging/seabunny/org.femgore.Seabunny.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          cp packaging/seabunny/org.femgore.Seabunny.svg AppDir/org.femgore.Seabunny.svg
          QMAKE=/usr/bin/qmake6 \
            QML_SOURCES_PATHS="$GITHUB_WORKSPACE/qml" \
            LINUXDEPLOY_OUTPUT_VERSION="$VERSION" \
            LDAI_OUTPUT="Seabunny-${VERSION}-x86_64.AppImage" \
            APPIMAGE_EXTRACT_AND_RUN=1 DEBUG=1 \
            ./linuxdeploy.AppImage --appdir AppDir --plugin qt --output appimage \
            > /tmp/seabunny-appimage.log 2>&1 || {
              result=$?
              diagnostics="$(grep -Ei 'error|failed|not found|no such file|fatal|cannot' /tmp/seabunny-appimage.log | tail -n 8 || true)"
              if [ -z "$diagnostics" ]; then diagnostics="$(tail -n 8 /tmp/seabunny-appimage.log)"; fi
              printf '%s\n' "$diagnostics" | while IFS= read -r line; do
                echo "::error title=AppImage diagnostic::$line"
              done
              exit "$result"
            }
          cat /tmp/seabunny-appimage.log
          mkdir -p dist
          mv "Seabunny-${VERSION}-x86_64.AppImage" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  publish:
    needs: [linux-packages, appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist
          merge-multiple: true
      - name: Verify the four release assets
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: CHANGELOG.md
          files: dist/*
